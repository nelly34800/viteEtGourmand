services:
  front-vite-et-gourmand:
    container_name: front-vite-et-gourmand
    build:
      context: .
      dockerfile: Dockerfile.front
    ports:
      - "${FRONT_PORT}:80"
    depends_on:
      - back-vite-et-gourmand
    volumes:
      - ./frontend/public:/usr/share/nginx/html

  back-vite-et-gourmand:
    container_name: back-vite-et-gourmand
    build:
      context: .
      dockerfile: Dockerfile.back
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
      MONGODB_URL: mongodb://mongo:27017
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
      - mongo

  db:
    image: mysql:8.0
    container_name: vite-et-gourmand-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DATA_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: vite-et-gourmand-phpmyadmin
    restart: always
    environment:
      PMA_HOST: ${MYSQL_HOST}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MY_ADMIN_PORT}:80"

  mongo:
    image: mongo:6.0
    container_name: vite-et-gourmand-mongo
    restart: always
    ports:
      - "${MONGODB_PORT}:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express
    container_name: vite-et-gourmand-mongo-express
    restart: always
    ports:
      - "${MONGODB_EXPRESS_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: ${MONGODB_SERVER}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGODB_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGODB_PSW}

volumes:
  db_data:
  mongo_data:

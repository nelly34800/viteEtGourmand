<img src="../assets/img/bigTitleContact.jpg" class="hero-scene" alt="image décorative représentant des icônes de contact (email, téléphone, mobile et message) avec un liseret doré autour de l'image">

<div class="container p-4">
      <h1>Récupération de votre email</h1>
      <p>Pour modifier votre mot de passe, merci de renseigner votre adresse email</p>
      <form id="resetPasswordForm">
          <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="test@mail.fr" />
              <div class="invalid-feedback">
                  Le mail n'est pas au bon format
              </div>
          </div>
          <div class="text-center">
              <button type="submit" class="btn btn-primary" id="validation-inscription">Envoyer</button>
          </div>
      </form>
</div>

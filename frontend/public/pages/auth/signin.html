<img src="../assets/img/bigTitleContact.jpg" class="hero-scene" alt="image décorative représentant des icônes de contact (email, téléphone, mobile et message) avec un liseret doré autour de l'image">

<h1>Connexion</h1>
<div class="container p-4">
  <form>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email"placeholder="test@mail.fr" />
      <div class="invalid-feedback">
        le mail et le mot de passe ne correspondent pas
      </div>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="password" name="password" />
    </div>
    <div id="signin-message" class="alert d-none"></div>
    <div class="text-center">
      <button type="button" class="btn btn-primary" id="signin">Se connecter</button>
    </div>
    <div class="text-center pt-3">
      <a href="/signup">vous n'avez pas de compte ? Inscrivez-vous ici ! </a>
    </div>
  </form>
</div>

<h1>Modifier vos informations personnelles</h1>

<div class="container p-4">
  <form>
    <div class="mb-3">
      <label for="lastName" class="form-label">Nom</label>
      <input type="text" class="form-control" id="lastName" name="lastName" placeholder="votre nom" value=""/>
      <div class="invalid-feedback">
        Le nom est requis
      </div>
    </div>
    <div class="mb-3">
      <label for="firstName" class="form-label">Prénom</label>
      <input type="text" class="form-control" id="firstName" name="firstName" placeholder="votre prénom" value="" />
        <div class="invalid-feedback">
          Le prénom est requis
        </div>
    </div>
    <div class="mb-3">
      <label for="address" class="form-label">Adresse postale</label>
      <input type="text" class="form-control" id="address" name="address" placeholder="votre adresse" value="" />
      <div class="invalid-feedback">
        L'adresse est requise
      </div>
    </div>
    <div class="mb-3">
      <label for="postalCode" class="form-label">Code postal</label>
      <input type="text" maxlength="5" pattern="[0-9]{5}" inputmode="numeric" class="form-control" id="postalCode" name="postalCode" placeholder="votre code postal" value="" />
      <div class="invalid-feedback">
        Le code postal est requis
      </div>
    </div>
    <div class="mb-3">
      <label for="city" class="form-label">Ville</label>
      <input type="text" class="form-control" id="city" name="city" placeholder="votre ville" value="" />
      <div class="invalid-feedback">
        La ville est requise
      </div>
    </div>
    <div class="mb-3">
      <label for="phone" class="form-label">Téléphone</label>
      <input type="tel" pattern="[0-9\s+]+" inputmode="tel" class="form-control" id="phone" name="phone" placeholder="06 12 34 56 78" value="" />
      <div class="invalid-feedback">
        Le numéro de téléphone est requis
      </div>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary" id="validation-modification">Modifier mes informations</button>
      <button type="button" class="btn btn-danger">Supprimer mon compte</button>
    </div>
    <div class="text-center pt-3">
      <a href="/editPassword">modifier mon mot de passe</a>
    </div>

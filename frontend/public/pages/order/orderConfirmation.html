<div class="container p-4">
    <H1>Confirmation de la commande</H1>
    <form action="">
        <fieldset class="align_left">
            <legend>La commande est concidérée comme définitive une fois les 3 cases suivantes cochées: </legend>
            <label><input type="checkbox" id="acceptCgv" name="cgv" /> J’accepte les Conditions Générales de Vente </label><br>
            <label><input type="checkbox" id="acceptAllergens" name="allergens" /> J’ai pris connaissance des allergènes</label><br>
            <label><input type="checkbox" id="acceptConditions" name="conditions" /> J’ai lu et j’accepte les conditions du/des menu(s) commandé(s)</label>
        </fieldset>

        <div>
            <a class="btn btn-primary" href="/cgv" target="_blank" rel="noopener noreferrer">Ouvrir CGV</a> dans un nouvel onglet<br>
            <button type="button" class="btn btn-primary btn-sm allergensModalBtn">liste des allèrgènes des menus de la commande</button><br>
            <button type="button" class="btn btn-primary btn-sm conditionsModalBtn">liste des conditions des menus de la commande</button>
        </div>

        <button type="button" id="confirmOrderBtn" class="btn btn-primary mt-4">confirmation définitive de la commande</button>
    </form>
</div>

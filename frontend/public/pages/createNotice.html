<img src="../assets/img/bigTitleAccueil.jpg" class="hero-scene" alt="image décorative représentant des icônes de contact (email, téléphone, mobile et message) avec un liseret doré autour de l'image">

<div class="container p-4">
  <h1>Emettre un avis</h1>
  <form action="">
    <div class="mb-3">
      <label class="form-label" for="note">Note sur 5 : </label>
      <input class="form-control" type="number" step="1" min="1" max="5" name="note" id="note">
      <div class="invalid-feedback">
          La note est requise
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="description">Description : </label>
      <textarea class="form-control" cols="30" rows="10" name="description" id="description"></textarea>
      <div class="invalid-feedback">
          La description est requise
      </div>
    </div>
    <div class="mb-3">
      <label for="signature" class="form-label">Signature : </label>
      <input type="text" class="form-control" id="signature" name="signature">
      <div class="invalid-feedback">
          La signature est requise
      </div>
    </div>
    <div id="create-message" class="alert d-none"></div>
    <input type="submit" class="btn btn-primary " value="Créer l'avis" id="noticeValidation">
  </form>
</div>

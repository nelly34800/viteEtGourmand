<img src="../assets/img/bigTitleAccueil.jpg" class="hero-scene" alt="image décorative représentant des icônes de contact (email, téléphone, mobile et message) avec un liseret doré autour de l'image">

<h1>Nous contacter</h1>

<form action="" class="container p-4">
    <div class="mb-3">
    <label for="firstName" class="form-label">Prénom : </label>
    <input disabled type="text" class="form-control" id="firstName" name="firstName">
    </div>
    <div class="mb-3">
    <label for="note" class="form-label">Note : </label>
    <input type="number" class="form-control" id="note" name="note" min="1" max="5" placeholder="note de 1 à 5">
    </div>
    <div class="mb-3">
    <label for="description" class="form-label">Commentaire : </label>
    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <button type="submit" class="btn btn-primary">Envoyer</button>
    </div>

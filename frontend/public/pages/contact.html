<h1>Nous contacter</h1>

<form action="" class="container p-4">
    <div class="mb-3">
    <label for="title" class="form-label">Titre : </label>
    <input type="text" class="form-control" id="title" name="title" placeholder="titre de votre message">
    </div>
    <div class="mb-3">
    <label for="description" class="form-label">Description : </label>
    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
    </div>
      <div class="mb-3">
    <label for="email" class="form-label">Email : </label>
    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
    </div>
    <div class="mb-3">
      <div id="showMessage" class="alert d-none"></div>
      <button type="submit" id="validation" class="btn btn-primary">Envoyer</button>
    </div>
</form>

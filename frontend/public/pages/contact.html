<h1>Nous contacter</h1>

<form action="" class="container p-4">
    <div class="mb-3">
    <label for="titre" class="form-label">Titre : </label>
    <input type="text" class="form-control" id="titre" name="titre" placeholder="titre de votre message">
    </div>
    <div class="mb-3">
    <label for="description" class="form-label">Description : </label>
    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
    </div>
      <div class="mb-3">
    <label for="email" class="form-label">Email : </label>
    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
    </div>
    <div class="mb-3">
        <button type="submit" class="btn btn-primary">Envoyer</button>
    </div>
</form>
<div class="container p-4r">
  <h2>Nous trouver</h2>
  <div class="map">
    <iframe
      src="https://maps.google.com/maps?q=traiteur+bordeaux&t=&z=13&ie=UTF8&iwloc=&output=embed"
      width="320" height="560" frameborder="0" scrolling="no" loading="lazy" >
    </iframe>
    <div class="map-address">
        <p>Vite & Gourmand<br>12 rue des Saveurs, 33000 Bordeaux</p>
    </div>
</div>

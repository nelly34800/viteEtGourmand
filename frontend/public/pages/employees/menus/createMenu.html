<div class="container p-4">
  <h1>Créer/modifier un menu</h1>
  <form action="">
    <div class="mb-3">
      <label class="form-label" for="menuName">Nom du menu : </label>
      <input class="form-control" type="text" name="menuName" id="menuName">
      <div class="invalid-feedback">
          Le nom du menu est requis
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="theme">Thème : </label>
      <textarea class="form-control" cols="30" rows="10" name="theme" id="theme"></textarea>
      <div class="invalid-feedback">
          Le thème est requis
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="description">Description : </label>
      <textarea class="form-control" cols="30" rows="10" name="description" id="description"></textarea>
      <div class="invalid-feedback">
          La description est requise
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="minPeople">Nombre de personne minimum : </label>
      <input class="form-control" type="number" step="1" name="minPeople" id="minPeople">
      <div class="invalid-feedback">
          Le nombre de personne minimum est requis
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="price">Prix du menu : </label>
      <input class="form-control" type="number" step="1" name="price" id="price">
      <div class="invalid-feedback">
          Le prix du menu est requis
      </div>
    </div>
     <div class="mb-3">
      <label class="form-label" for="remainingQuantity">Nombre de commande encore disponible pour ce menu : </label>
      <input class="form-control" type="number" step="1" name="remainingQuantity" id="remainingQuantity">
      <div class="invalid-feedback">
          Le nombre de commande encore disponible pour ce menu est requis
      </div>
    </div>
    <div id="dishes-container" class="mb-3">
      <label class="bgc-secondary">Plats : </label>
    </div>
      <div id="conditions-container" class="mb-3">
        <label class="bgc-secondary">Conditions du menu : </label>
    </div>
    <div id="showMessage" class="alert d-none"></div>
    <input type="submit" class="btn btn-primary" value="Créer le menu" id="menuValidation">
    <a href="/menu" class="btn btn-secondary">Retour</a>
  </form>
</div>

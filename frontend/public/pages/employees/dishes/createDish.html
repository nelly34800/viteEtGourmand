<div class="container p-4">
  <h1>Créer/modifier un plat</h1>
  <form action="">
    <div class="mb-3">
      <label class="form-label" for="dishTitle">Nom du plat : </label>
      <input class="form-control" type="text" name="dishTitle" id="dishTitle">
      <div class="invalid-feedback">
          Le nom du plat est requis
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="description">Description : </label>
      <textarea class="form-control" cols="30" rows="10" name="description" id="description"></textarea>
      <div class="invalid-feedback">
          La description est requise
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="picture">Image : </label>
      <input class="form-control" type="text" name="picture" id="picture" placeholder="ex: brownie.jpg">
      <small>Format accepté : jpg, png, webp</small>
      <div class="invalid-feedback">
          L'image est requise
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="category">Catégorie du plat : </label>
      <select id="category" class="form-control">
        <option value=""class="bgc-secondary">Sélectionnez une catégorie</option>
      </select>
      <div class="invalid-feedback">
          La catégorie est requise
      </div>
    </div>
    <div id="allergens-container" class="mb-3">
      <label class="bgc-secondary">Allergènes :</label>
    </div>
     <div id="diets-container" class="mb-3">
      <label class="bgc-secondary">Régimes alimentaires :</label>
    </div>
    <input type="submit" class="btn btn-primary " value="Créer le plat" id="dishValidation">
    <a href="/dishes" class="btn btn-secondary">Retour</a>
  </form>
</div>

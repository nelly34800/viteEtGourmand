<div class="container p-4">
  <h1>Créer/modifier un forfait de personnel</h1>
  <form action="">
    <div class="mb-3">
      <label class="form-label" for="eventType">type d'évènment : </label>
      <input class="form-control" type="text" name="eventType" id="eventType">
      <div class="invalid-feedback">
          Le type d'évènment est requis
      </div>
    </div>
        <div class="mb-3">
      <label class="form-label" for="staffRatio">ratio personnel/nombre d'invités : </label>
      <input class="form-control" type="number" step="1" name="staffRatio" id="staffRatio">
      <div class="invalid-feedback">
          Le ratio est requis
      </div>
    </div>
        <div class="mb-3">
      <label class="form-label" for="packagePrice">prix unitaire du forfait:  </label>
      <input class="form-control" type="number" step="1" name="packagePrice" id="packagePrice">
      <div class="invalid-feedback">
          Le prix est requis
      </div>
    </div>
    <input type="submit" class="btn btn-primary " value="Créer le forfait de personnel" id="personalPackageValidation">
    <a href="/personalPackages" class="btn btn-secondary">Retour</a>
  </form>
</div>

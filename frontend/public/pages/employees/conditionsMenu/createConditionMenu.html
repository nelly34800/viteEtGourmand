<div class="container p-4">
  <h1>Créer/modifier une condition de menu</h1>
  <form action="">
    <div class="mb-3">
      <label class="form-label" for="conditionType">Type de condition : </label>
      <input class="form-control" type="text" name="conditionType" id="conditionType">
      <div class="invalid-feedback">
          Le type de condition est requis
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="description">Description : </label>
      <textarea class="form-control" cols="30" rows="10" name="description" id="description"></textarea>
      <div class="invalid-feedback">
          La description est requise
      </div>
    </div>
    <div id="creat-message" class="alert d-none"></div>
    <input type="submit" class="btn btn-primary " value="Créer la condition" id="conditionValidation">
  </form>
</div>

<div id="container" class="container p-4">

  <h1 id="menu-title"></h1>
  <p id="menu-description"></p>

  <!-- CAROUSEL -->
  <div class="carousel-wrapper d-flex flex-column align-items-center">
    <button class="custom-control-prev bgc-primary mb-3" data-bs-target="#menu-carousel" data-bs-slide="prev">
      <i class="bi bi-caret-up-fill note"></i>
    </button>
    <div id="menu-carousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner" id="carouselInner"></div>
    </div>
    <button class="carousel-control-prev" data-bs-target="#menu-carousel" data-bs-slide="prev">
      <i class="bi bi-caret-left-fill bgc-primary"></i>
    </button>
    
    <button class="carousel-control-next" data-bs-target="#menu-carousel" data-bs-slide="next">
      <i class="bi bi-caret-right-fill bgc-primary"></i>
    </button>
    <button class="custom-control-next bgc-primary mt-3" data-bs-target="#menu-carousel" data-bs-slide="next">
      <i class="bi bi-caret-down-fill note"></i>
    </button>
  </div>

  <!-- PLATS -->
  <div id="dishes-container" class="mt-4"></div>

    <!-- CONDITIONS -->
  <div id="menu-conditions"></div>

      <!-- INFOS -->
  <div id="menu-infos"></div>

  <!-- ACTION -->
  <div class="mt-4 text-center">
    <button id="reserve_btn" class="btn btn-primary playfair">
      Réserver
    </button>
  </div>

</div>

<!-- Modal panier-->
<div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="cartModalLabel">Le menu a été ajouté au panier : </h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-actions">
        <a class="btn btn-primary" href="/menus">Ajouter d'autres menus</a>
        <a class="btn btn-primary" href="/cart">Voir mon panier</a>
      </div>
    </div>
  </div>
</div>
